name: Build and Release Mimi Java Launcher

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release Version (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_title:
        description: 'Release Title'
        required: true
        default: 'Mimi Java Launcher New Build'

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Create Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: gradle

    - name: Grant Execute Permission for Gradle
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    # 1. Artifacts Box Step (Yahan se zip box banega)
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Mimi-Launcher-APK
        path: "**/build/outputs/apk/debug/*.apk"

    # 2. Binaries Se Releases Par Upload Karne Ka Step
    - name: Create GitHub Release
      if: github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.version_name }}
        name: ${{ github.event.inputs.release_title }}
        draft: false
        prerelease: false
        files: "**/build/outputs/apk/debug/*.apk"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
