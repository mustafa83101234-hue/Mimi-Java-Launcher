name: Build and Release Mimi Java Launcher

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # GitHub website par "Run workflow" button se chalane ke liye ⚙️

permissions:
  contents: write # Releases banane ke liye yeh permission zaroori hai!

jobs:
  build:
    name: Build APK and Create Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: gradle

    - name: Grant Execute Permission for Gradle
      run: chmod +x gradlew

    # Resource validation aur lint ko skip kiya hai taake build fail na ho 🛠️
    - name: Build Debug APK
      run: ./gradlew assembleDebug -Pandroid.experimental.disableResourcesValidation=true -x lint

    # 1. ARTIFACTS BOX STEP (Download box banayega)
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Mimi-Launcher-APK-Box
        path: "**/build/outputs/apk/debug/*.apk"

    # 2. AUTOMATED RELEASE STEP (Binaries ko automatic release mein upload karega)
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v1.0-${{ github.run_number }}" # Har baar unique tag banega taake error na aaye
        name: "Mimi Launcher Release v1.0.${{ github.run_number }}"
        draft: false
        prerelease: false
        files: "**/build/outputs/apk/debug/*.apk"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
