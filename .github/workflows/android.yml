name: Android CI

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release Version (e.g., v1.0.0-fork)'
        required: true
        default: 'v1.0.0-fork'
      release_title:
        description: 'Release Title'
        required: true
        default: 'FCL Fork New Build'

jobs:
  build:
    name: Build and Release FoldCraft Launcher
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: gradle

    - name: Grant Execute Permission for Gradle
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    # 1. Artifacts Upload Step
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: FCL-Fork-APK
        path: app/build/outputs/apk/debug/*.apk

    # 2. Automated Release Step (Sirf manual run par chalega)
    - name: Create GitHub Release
      if: github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.version_name }}
        name: ${{ github.event.inputs.release_title }}
        draft: false
        prerelease: false
        files: app/build/outputs/apk/debug/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
