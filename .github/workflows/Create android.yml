name: Build and Release Mimi Java Launcher

on:
  push:
    tags:
      - "v*" # Jab bhi aap v1.0, v1.1 jaisa koi tag push karenge, yeh khud chal padega

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Create Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: gradle

    - name: Grant Execute Permission for Gradle
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    # 1. Artifacts Upload Step
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Mimi-Launcher-APK
        path: "**/build/outputs/apk/debug/*.apk"

    # 2. Automated Release Step (Sirf tag push par automatic chalega)
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: "Release ${{ github.ref_name }}"
        draft: false
        prerelease: false
        files: "**/build/outputs/apk/debug/*.apk"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
